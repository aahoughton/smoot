[tools]
go = "1.27.4"
golangci-lint = "2.14.0"
lefthook = "2.2.1"
gitleaks = "8.30.1"

[tasks.build]
description = "Build the smoot binary into ./bin"
run = "go build -o bin/smoot ./cmd/smoot"

[tasks.test]
description = "Run all Go tests"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.secrets]
description = "Scan git history for secrets"
run = "gitleaks git --redact --no-banner"

[tasks.vuln]
description = "Check dependencies for known vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.check]
description = "Everything CI runs: lint, test, vuln, secrets"
depends = ["lint", "test", "vuln", "secrets"]

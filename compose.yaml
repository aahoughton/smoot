# Fixed so the volume is smoot_smoot-data wherever the checkout lives.
name: smoot

services:
  smoot:
    build:
      context: .
      args:
        # Reported by smoot version and whoami, e.g. SMOOT_VERSION=$(git describe --always).
        VERSION: "${SMOOT_VERSION:-dev}"
    image: smoot:local
    # Published on loopback only. Set SMOOT_BIND=0.0.0.0 to expose it to your
    # network; with auth off, anyone who can reach it can read and post.
    ports:
      - "${SMOOT_BIND:-127.0.0.1}:${SMOOT_PORT:-8787}:8787"
    environment:
      SMOOT_WEB: "${SMOOT_WEB:-false}"
      # none (anyone who reaches the port can read and post) or token.
      SMOOT_AUTH: "${SMOOT_AUTH:-none}"
      # The URL browsers use, e.g. https://smoot.example behind a TLS proxy.
      SMOOT_PUBLIC_URL: "${SMOOT_PUBLIC_URL:-}"
      SMOOT_TRUSTED_PROXIES: "${SMOOT_TRUSTED_PROXIES:-}"
      # Host names the server answers to; add yours (or *) with SMOOT_BIND.
      SMOOT_ALLOWED_HOSTS: "${SMOOT_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
      # Offer agents a feedback tool; read notes with smoot admin feedback.
      SMOOT_FEEDBACK: "${SMOOT_FEEDBACK:-false}"
      # Let participants pass files with smoot attach and smoot get.
      SMOOT_ATTACHMENTS: "${SMOOT_ATTACHMENTS:-false}"
    volumes:
      - smoot-data:/data
    restart: unless-stopped

volumes:
  smoot-data:
